<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Painel de Tarefas - SENAI</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="cartao-aplicacao">

        <header class="cabecalho-aplicacao">

            <div class="titulo">
                <img src="c:\Users\Daniel Martinez\Downloads\minhafoto.jpg"
                     alt="Minha foto"
                     class="foto">

                <div>
                    <h1>Minhas Tarefas ✨</h1>
                    <p>Organize suas tarefas do SENAI</p>
                </div>
            </div>

            <!-- Botão de tema -->
            <button id="botao-alternar-tema"
                    class="botao-icone"
                    title="Alternar tema">

                <i class="fa-solid fa-moon"></i>

            </button>

        </header>


        <!-- Buscar tarefas -->
        <div class="caixa-busca">

            <input type="text"
                   id="campo-busca"
                   placeholder="🔍 Buscar tarefa...">

        </div>


        <!-- Limpar tarefas concluídas -->
        <div class="acoes-tarefas">

            <button id="botao-limpar-concluidas"
                    class="botao-principal">

                <i class="fa-solid fa-trash"></i>

                Limpar concluídas

            </button>

        </div>


        <!-- Adicionar tarefa -->
        <div class="caixa-entrada">

            <input type="text"
                   id="campo-tarefa"
                   placeholder="O que vamos fazer hoje?..."
                   maxlength="40">

            <button id="botao-adicionar"
                    class="botao-principal">

                <i class="fa-solid fa-plus"></i>

                Adicionar

            </button>

        </div>


        <!-- Lista de tarefas -->
        <ul id="lista-tarefas"
            class="lista-tarefas">

        </ul>


        <!-- Rodapé -->
        <footer class="rodape-aplicacao">

            <span id="contador-tarefas">
                0 tarefas na lista
            </span>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
